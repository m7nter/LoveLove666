name: Build SecureVault IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA (no signing)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show installed Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate source tree
        run: |
          test -f Sources/SecureVault/App/SecureVaultApp.swift
          test -f Tests/SecureVaultTests/StorageAndEditingTests.swift
          test -f Tests/SecureVaultTests/ExportAndErasureTests.swift

      - name: Validate App Icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path('Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          image = path.read_bytes()
          if image[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', image[16:24]) != (1024, 1024):
              raise SystemExit('AppIcon.png must be a valid 1024x1024 PNG from the full source archive')
          print('AppIcon.png: PNG signature and 1024x1024 dimensions verified')
          PY

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          candidates = [d for runtime, group in devices.items() if '.iOS-' in runtime
                        for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator installed')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          print('Tests use:', candidates[0]['name'])
          PY

      - name: Boot test simulator
        timeout-minutes: 7
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          simulator = os.environ['TEST_SIMULATOR_ID']
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', '--json'], timeout=30))['devices']
          device = next(d for group in devices.values() for d in group if d['udid'] == simulator)
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', simulator], check=True, timeout=60)
          # Previously the first explicit boot/wait happened only after tests.
          # Fail here with simulator output instead of hanging after compilation.
          subprocess.run(['xcrun', 'simctl', 'bootstatus', simulator, '-b'], check=True, timeout=300)
          print('Simulator is ready for test execution.', flush=True)
          PY

      - name: Run storage, editing and recovery tests
        id: tests
        env:
          NSUnbufferedIO: "YES"
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee ci-diagnostics/xcode-tests.log
          import os
          import signal
          import subprocess

          command = [
              "xcodebuild", "test",
              "-project", "SecureVault.xcodeproj",
              "-scheme", "SecureVault",
              "-configuration", "Debug",
              "-destination", f"platform=iOS Simulator,id={os.environ['TEST_SIMULATOR_ID']}",
              "CODE_SIGNING_ALLOWED=YES",
              "CODE_SIGN_IDENTITY=-",
              "-parallel-testing-enabled", "NO",
              "-test-timeouts-enabled", "YES",
              "-default-test-execution-time-allowance", "90",
              "-maximum-test-execution-time-allowance", "180",
              "-derivedDataPath", os.path.join(os.environ["GITHUB_WORKSPACE"], "test_build"),
              "-resultBundlePath", os.path.join(os.environ["GITHUB_WORKSPACE"], "TestResults.xcresult"),
          ]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              status = process.wait(timeout=1200)
          except subprocess.TimeoutExpired:
              print("Simulator tests exceeded 20 minutes; this run is not validated for distribution.", flush=True)
              # Stop child test runners as well as xcodebuild so they cannot
              # leave the simulator busy during diagnostics/Release compilation.
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              raise SystemExit(124)
          raise SystemExit(status)
          PY

      - name: Export readable test results
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          bundle = Path('TestResults.xcresult')
          output = Path('ci-diagnostics')
          output.mkdir(exist_ok=True)
          if not bundle.is_dir():
              print('No XCTest result bundle was produced.')
              raise SystemExit(0)
          # Export on macOS while xcresulttool is available, so a Windows
          # reviewer can read exact failures without reverse-parsing xcresult.
          for name in ('summary', 'tests'):
              with (output / ('test-' + name + '.json')).open('w') as result, \
                   (output / ('test-' + name + '-export.log')).open('w') as log:
                  try:
                      subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', name,
                                      '--path', str(bundle)], stdout=result, stderr=log, timeout=60)
                  except subprocess.TimeoutExpired:
                      log.write('xcresulttool export timed out.\n')
          try:
              subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(bundle),
                              '--output-path', str(output / 'test-attachments')], timeout=60)
          except subprocess.TimeoutExpired:
              print('Attachment export timed out.')
          PY

      - name: Collect simulator failure diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p ci-diagnostics
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          output = pathlib.Path('ci-diagnostics')
          commands = {
              'simulator-devices.log': ['xcrun', 'simctl', 'list', 'devices'],
              'test-host.log': ['xcrun', 'simctl', 'spawn', os.environ.get('TEST_SIMULATOR_ID', ''),
                                'log', 'show', '--last', '5m', '--style', 'compact',
                                '--predicate', 'process == "SecureVault" OR process == "testmanagerd"'],
          }
          for name, command in commands.items():
              with (output / name).open('w') as log:
                  try:
                      subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=35)
                  except subprocess.TimeoutExpired:
                      log.write('\nDiagnostic command timed out.\n')
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          candidates = [p for p in reports.glob('*') if p.is_file()
                        and any(s in p.name for s in ('SecureVault', 'Simulator', 'testmanagerd'))]
          for report in sorted(candidates, key=lambda p: p.stat().st_mtime, reverse=True)[:15]:
              shutil.copy2(report, output / report.name)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoveLove666-TestResults
          path: |
            TestResults.xcresult
            ci-diagnostics/
          if-no-files-found: ignore

      - name: Capture calculator preview
        if: success()
        run: |
          xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
          xcrun simctl status_bar "$TEST_SIMULATOR_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl terminate "$TEST_SIMULATOR_ID" com.securevault.app || true
          xcrun simctl launch "$TEST_SIMULATOR_ID" com.securevault.app --test-calculator
          sleep 3
          xcrun simctl io "$TEST_SIMULATOR_ID" screenshot Calculator-preview.png
          for mode in scientific conversion units example; do
            xcrun simctl terminate "$TEST_SIMULATOR_ID" com.securevault.app
            xcrun simctl launch "$TEST_SIMULATOR_ID" com.securevault.app --test-calculator --preview-$mode
            sleep 5
            xcrun simctl io "$TEST_SIMULATOR_ID" screenshot Calculator-$mode.png
          done
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UI-previews

      - name: Upload calculator preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-preview
          path: |
            Calculator-*.png
            UI-previews/

      - name: Build app
        id: release
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project SecureVault.xcodeproj \
            -scheme SecureVault \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            build 2>&1 | tee "$RUNNER_TEMP/release-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -E "error:|fatal error:|BUILD FAILED|linker command failed" "$RUNNER_TEMP/release-build.log" | tail -40 | while IFS= read -r line; do
              echo "::error title=Xcode release diagnostic::$line"
            done || true
            tail -40 "$RUNNER_TEMP/release-build.log" | while IFS= read -r line; do
              echo "::error title=Xcode release log::$line"
            done
          fi
          exit "$build_status"

      - name: Package into IPA
        id: package
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.release.outcome == 'success' }}
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/SecureVault.app"
          test -d "$APP_PATH"
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$EXECUTABLE_NAME"
          xcrun lipo "$APP_PATH/$EXECUTABLE_NAME" -verify_arch arm64
          echo "Found app at: $APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/ipa_output/Payload"
          cp -r "$APP_PATH" "$GITHUB_WORKSPACE/ipa_output/Payload/"
          cd "$GITHUB_WORKSPACE/ipa_output"
          zip -r "../SecureVault.ipa" Payload/
          ls -lh "$GITHUB_WORKSPACE/SecureVault.ipa"

      - name: Upload IPA artifact
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: LoveLove666-IPA
          path: SecureVault.ipa
          retention-days: 30

      - name: Upload Release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoveLove666-ReleaseLog
          path: ${{ runner.temp }}/release-build.log
          if-no-files-found: ignore

