name: SecureVault
options:
  bundleIdPrefix: com.securevault
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  projectFormat: "xcode15_0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: SecureVault
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    INFOPLIST_FILE: Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.securevault.app
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_REFLECTION_METADATA_LEVEL: without-names
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_TESTABILITY: NO
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      GCC_SYMBOLS_PRIVATE_EXTERN: YES

targets:
  SecureVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SecureVaultUITests
    dependencies:
      - target: SecureVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.securevault.uitests
        PRODUCT_NAME: SecureVaultUITests
        TEST_TARGET_NAME: SecureVault
  SecureVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecureVaultTests
    dependencies:
      - target: SecureVault
      - package: ZIPFoundation
      - package: MapLibre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.securevault.tests
        PRODUCT_NAME: SecureVaultTests
        PRODUCT_MODULE_NAME: SecureVaultTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecureVault.app/SecureVault"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SecureVault:
    type: application
    platform: iOS
    sources:
      - path: Sources/SecureVault
        type: group
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/OfflineRegions.json
        buildPhase: resources
      - path: Resources/OfflineZoneSources.json
        buildPhase: resources
      - path: Resources/MapLibre-LICENSE.txt
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: MapLibre
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/Simulator.entitlements

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    exactVersion: 6.31.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

schemes:
  SecureVault:
    build:
      targets:
        SecureVault: all
        SecureVaultTests: [test]
        SecureVaultUITests: [test]
    test:
      config: Debug
      targets:
        - SecureVaultTests
        - SecureVaultUITests
